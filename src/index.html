<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob:">
  <title>Hisham's PDF Editor</title>
  <link rel="stylesheet" href="pdfjs-layers.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><span id="brandName">Hisham's PDF Editor</span></div>
    <div class="group" id="fileGroup"></div>
    <div class="sep"></div>
    <div class="group tools" id="toolGroup"></div>
    <div class="sep"></div>
    <div class="group" id="insertGroup"></div>
    <div class="spacer"></div>
    <div class="group" id="historyGroup"></div>
    <div class="sep"></div>
    <div class="group" id="viewGroup"></div>
    <div class="sep"></div>
    <div class="group" id="moreGroup"></div>
  </header>
  <div class="propbar" id="propbar" hidden></div>
  <main>
    <aside class="sidebar" id="sidebar">
      <div class="side-tabs" role="tablist">
        <button id="sideTabPages" class="on" role="tab"></button>
        <button id="sideTabOutline" role="tab"></button>
      </div>
      <div class="side-head"><div class="group" id="pageGroup"></div></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="outline" id="outline" hidden></div>
    </aside>
    <section class="docarea">
      <div class="tabbar" id="tabbar" role="tablist" hidden></div>
      <div class="findbar" id="findbar" hidden>
        <input id="findInput" type="search" autocomplete="off">
        <span id="findCount" class="find-count"></span>
        <button id="findPrev" class="icon-btn"></button>
        <button id="findNext" class="icon-btn"></button>
        <button id="findClose" class="icon-btn"></button>
      </div>
      <div class="views" id="views"></div>
      <div class="welcome" id="welcome">
        <div class="welcome-card">
          <div class="welcome-icon" id="welcomeIcon"></div>
          <h1 id="welcomeTitle"></h1>
          <p id="welcomeText"></p>
          <div class="welcome-actions">
            <button class="btn primary big" id="welcomeOpen"></button>
            <button class="btn big" id="welcomeImages"></button>
          </div>
          <div class="hint" id="welcomeHint"></div>
          <div class="recent" id="recent"></div>
        </div>
      </div>
      <div class="drop-hint" id="dropHint"></div>
    </section>
  </main>
  <footer class="status" id="status"></footer>
  <div class="selbar" id="selbar" hidden></div>
  <div id="toasts"></div>
  <div id="busy" hidden><div class="spinner"></div><span></span><div class="bar"><i></i></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
