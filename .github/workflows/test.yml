# Runs lint, unit tests and the UI tests (inside the real Electron app) on every PR and push to main.
name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest # the app is Windows-first; UI tests need a desktop session and Windows fonts
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - name: Keep screenshots and logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-out
          path: test/out/
